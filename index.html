<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan's Daily Command</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e;
    --surface: #141816;
    --surface2: #1c201e;
    --border: #2a302c;
    --accent: #c8f060;
    --accent2: #60f0b8;
    --accent3: #f0c060;
    --accent4: #f06090;
    --text: #e8ede9;
    --text-dim: #7a8c7d;
    --text-muted: #3d4d3f;
    --focus-bg: rgba(200, 240, 96, 0.06);
    --nudge-bg: rgba(240, 192, 96, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  /* DAY PICKER OVERLAY */
  #day-picker-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    animation: fadeIn 0.4s ease;
  }

  #day-picker-overlay h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 8vw, 96px);
    letter-spacing: 0.06em;
    color: var(--accent);
    line-height: 1;
  }

  #day-picker-overlay p {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 0;
  }

  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    max-width: 700px;
    width: 90%;
  }

  .day-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 20px 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .day-btn .day-initial {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.05em;
    color: var(--text);
    line-height: 1;
  }

  .day-btn.office .day-initial { color: var(--accent2); }
  .day-btn.flex .day-initial { color: var(--accent); }
  .day-btn.church .day-initial { color: var(--accent3); }
  .day-btn.weekend .day-initial { color: var(--accent4); }

  .day-btn:hover {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--text);
    transform: translateY(-2px);
  }

  .day-btn .tag {
    font-size: 9px;
    letter-spacing: 0.1em;
    opacity: 0.6;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13, 15, 14, 0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  .header-left h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  #current-day-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { border-color: var(--accent); color: var(--accent); background: var(--focus-bg); }
  .btn.danger { border-color: var(--accent4); color: var(--accent4); }

  /* LIVE CLOCK */
  #live-clock {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* PROGRESS BAR */
  #day-progress-bar {
    height: 2px;
    background: var(--border);
    position: relative;
  }

  #day-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 60s linear;
  }

  /* MAIN LAYOUT */
  main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    min-height: calc(100vh - 62px);
  }

  /* SCHEDULE COLUMN */
  .schedule-col {
    padding: 32px;
    border-right: 1px solid var(--border);
  }

  .day-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 6px 12px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    margin-bottom: 28px;
  }

  .day-type-badge.office { border-color: var(--accent2); color: var(--accent2); }
  .day-type-badge.flex { border-color: var(--accent); color: var(--accent); }
  .day-type-badge.church { border-color: var(--accent3); color: var(--accent3); }
  .day-type-badge.weekend { border-color: var(--accent4); color: var(--accent4); }

  /* TIME BLOCKS */
  .block {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 0;
    margin-bottom: 2px;
    border: 1px solid transparent;
    transition: all 0.25s ease;
    position: relative;
    animation: slideIn 0.4s ease both;
  }

  .block:hover {
    border-color: var(--border);
    background: var(--surface);
  }

  .block.current-block {
    border-color: var(--accent) !important;
    background: var(--focus-bg) !important;
  }

  .block.current-block::before {
    content: '▶';
    position: absolute;
    left: -20px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-size: 10px;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .block-time {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    padding: 14px 16px 14px 0;
    letter-spacing: 0.05em;
    border-right: 1px solid var(--border);
    line-height: 1.5;
  }

  .block-time .end-time {
    display: block;
    font-size: 10px;
    opacity: 0.7;
  }

  .block-content {
    padding: 14px 16px;
  }

  .block-title {
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .block-title .pill {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
  }

  .pill.focus { background: rgba(200,240,96,0.15); color: var(--accent); }
  .pill.review { background: rgba(96,240,184,0.12); color: var(--accent2); }
  .pill.meals { background: rgba(240,192,96,0.12); color: var(--accent3); }
  .pill.workout { background: rgba(240,96,144,0.12); color: var(--accent4); }
  .pill.church { background: rgba(240,192,96,0.12); color: var(--accent3); }
  .pill.admin { background: rgba(122,140,125,0.15); color: var(--text-dim); }

  .block-detail {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  /* BLOCK EXPAND PANEL */
  .block { cursor: pointer; }

  .block-expand {
    display: none;
    grid-column: 1 / -1;
    background: var(--surface2);
    border-top: 1px solid var(--border);
    padding: 14px 16px 14px 96px;
    animation: expandIn 0.2s ease;
  }

  @keyframes expandIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .block.expanded { border-color: var(--border) !important; background: var(--surface) !important; }
  .block.expanded .block-expand { display: block; }
  .block.expanded.current-block { border-color: var(--accent) !important; }

  .expand-section { margin-bottom: 10px; }
  .expand-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .expand-value {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .expand-value.highlight { color: var(--text); }

  .expand-tips {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .tip-item {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    padding: 3px 0;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .tip-item::before { content: '—'; color: var(--text-muted); flex-shrink: 0; }

  .block-separator {
    height: 1px;
    background: var(--border);
    margin: 12px 0;
    opacity: 0.4;
  }

  /* Section headings inside schedule */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 20px 0 8px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  /* SIDEBAR */
  .sidebar {
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px;
  }

  .sidebar-card h3 {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* PRIORITIES */
  .priority-item {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .priority-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--accent);
    line-height: 1;
    flex-shrink: 0;
  }

  .priority-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 300;
    width: 100%;
    padding: 4px 0;
    outline: none;
    transition: border-color 0.2s;
  }

  .priority-input:focus { border-color: var(--accent); }
  .priority-input::placeholder { color: var(--text-muted); font-size: 12px; }

  /* MEAL LOG */
  .meal-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .meal-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
    width: 60px;
    flex-shrink: 0;
  }

  .meal-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 300;
    flex: 1;
    padding: 3px 0;
    outline: none;
    transition: border-color 0.2s;
  }

  .meal-input:focus { border-color: var(--accent3); }
  .meal-input::placeholder { color: var(--text-muted); font-size: 11px; }

  /* BRAIN DUMP */
  .brain-dump {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    line-height: 1.7;
    width: 100%;
    min-height: 80px;
    padding: 10px;
    outline: none;
    resize: vertical;
    transition: border-color 0.2s;
  }

  .brain-dump:focus { border-color: var(--accent); }
  .brain-dump::placeholder { color: var(--text-muted); }

  /* WORKOUT LOG */
  .workout-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .workout-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 300;
    flex: 1;
    padding: 3px 0;
    outline: none;
    transition: border-color 0.2s;
  }

  .workout-input:focus { border-color: var(--accent4); }
  .workout-input::placeholder { color: var(--text-muted); font-size: 11px; }

  /* FOCUS MODE */
  #focus-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #080a09;
    z-index: 400;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    animation: fadeIn 0.5s ease;
  }

  #focus-overlay.active { display: flex; }

  #focus-block-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 8vw, 80px);
    letter-spacing: 0.06em;
    color: var(--accent);
    text-align: center;
  }

  #focus-block-time {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  #focus-clock {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(60px, 14vw, 140px);
    letter-spacing: 0.04em;
    color: var(--text);
    line-height: 1;
    transition: color 0.5s;
  }

  .focus-divider {
    width: 80px;
    height: 1px;
    background: var(--border);
  }

  #focus-task-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: center;
  }

  #focus-task-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 300;
    text-align: center;
    width: min(500px, 80vw);
    padding: 8px 0;
    outline: none;
    transition: border-color 0.3s;
  }

  #focus-task-input:focus { border-color: var(--accent); }
  #focus-task-input::placeholder { color: var(--text-muted); font-size: 14px; }

  #focus-exit {
    position: absolute;
    top: 24px;
    right: 28px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--border);
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.2s;
  }

  #focus-exit:hover { border-color: var(--accent4); color: var(--accent4); }

  /* NUDGE TOAST */
  #nudge-toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--surface2);
    border: 1px solid var(--accent3);
    padding: 16px 20px;
    max-width: 300px;
    z-index: 600;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }

  #nudge-toast.show {
    transform: translateY(0);
    opacity: 1;
    pointer-events: all;
  }

  #nudge-toast .nudge-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent3);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #nudge-toast .nudge-text {
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
    font-weight: 300;
  }

  #nudge-dismiss {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    margin-top: 12px;
    padding: 0;
    display: block;
    transition: color 0.2s;
  }

  #nudge-dismiss:hover { color: var(--accent3); }

  /* ANIMATIONS */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Stagger blocks */
  .block:nth-child(1) { animation-delay: 0.03s; }
  .block:nth-child(2) { animation-delay: 0.06s; }
  .block:nth-child(3) { animation-delay: 0.09s; }
  .block:nth-child(4) { animation-delay: 0.12s; }
  .block:nth-child(5) { animation-delay: 0.15s; }
  .block:nth-child(6) { animation-delay: 0.18s; }
  .block:nth-child(7) { animation-delay: 0.21s; }
  .block:nth-child(8) { animation-delay: 0.24s; }
  .block:nth-child(9) { animation-delay: 0.27s; }
  .block:nth-child(10) { animation-delay: 0.30s; }
  .block:nth-child(11) { animation-delay: 0.33s; }
  .block:nth-child(12) { animation-delay: 0.36s; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  /* MOBILE */
  @media (max-width: 768px) {
    .day-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .day-btn { padding: 14px 4px; }
    .day-btn .day-initial { font-size: 22px; }
    .day-btn .tag { display: none; }

    header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
    .header-left h1 { font-size: 22px; }
    #current-day-label { font-size: 9px; }
    .header-right { gap: 6px; flex-wrap: wrap; }
    .btn { padding: 6px 10px; font-size: 9px; }
    #live-clock { font-size: 11px; }
    .save-indicator { display: none; }

    main { grid-template-columns: 1fr; }
    .schedule-col { padding: 16px; border-right: none; }
    .sidebar { padding: 16px; border-top: 1px solid var(--border); }

    .block { grid-template-columns: 70px 1fr; }
    .block-time { font-size: 10px; padding: 12px 10px 12px 0; }
    .block-content { padding: 12px 10px; }
    .block-title { font-size: 13px; flex-wrap: wrap; }
    .block.current-block::before { display: none; }

    /* Block detail panel on mobile - show inline always */
    .block-detail { font-size: 12px; }

    /* Block expand panel */
    .block-expand { display: block !important; }

    #day-picker-overlay h1 { font-size: 48px; }
    #day-picker-overlay p { font-size: 10px; }

    #focus-block-name { font-size: 36px; }
    #focus-clock { font-size: 72px; }
    #focus-exit { top: 16px; right: 16px; padding: 6px 12px; font-size: 9px; }

    #nudge-toast { bottom: 16px; right: 16px; left: 16px; max-width: none; }
  }

  @media (max-width: 400px) {
    .day-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.accent { background: var(--accent); }
  .dot.accent2 { background: var(--accent2); }
  .dot.accent3 { background: var(--accent3); }
  .dot.accent4 { background: var(--accent4); }

  .save-indicator {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    transition: color 0.3s;
  }
  .save-indicator.saved { color: var(--accent2); }
</style>
</head>
<body>

<!-- DAY PICKER OVERLAY -->
<div id="day-picker-overlay">
  <div>
    <h1>COMMAND</h1>
    <p>Select today's day</p>
  </div>
  <div class="day-grid">
    <button class="day-btn flex" onclick="selectDay('monday')">
      <span class="day-initial">M</span>
      <span>Mon</span>
      <span class="tag">Flex</span>
    </button>
    <button class="day-btn office" onclick="selectDay('tuesday')">
      <span class="day-initial">T</span>

// ─── DAY PICKER ──────────────────────────────────────────────────────────────
function selectDay(day) {
  currentDay = day;
  document.getElementById('day-picker-overlay').style.display = 'none';
  renderSchedule(day);
  updateClock();
  startNudges();
  loadStorage();
}

function showDayPicker() {
  document.getElementById('day-picker-overlay').style.display = 'flex';
  saveStorage();
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderSchedule(day) {
  const data = schedules[day];
  document.getElementById('current-day-label').textContent = data.label;

  const col = document.getElementById('schedule-col');
  const badgeClass = data.type;
  const badgeLabels = { flex: 'Flex Day', office: 'Office Day', church: 'Office + Church', weekend: 'Weekend' };

  let html = `<div class="day-type-badge ${badgeClass}"><span class="dot ${badgeClass === 'office' ? 'accent2' : badgeClass === 'flex' ? 'accent' : badgeClass === 'church' ? 'accent3' : 'accent4'}"></span>${badgeLabels[badgeClass]}</div>`;

  // Tuesday bible study banner (through end of April)
  if (day === 'tuesday') {
    const now = new Date();
    const endOfApril = new Date(now.getFullYear(), 3, 30); // April 30
    if (now <= endOfApril) {
      html += `<div style="background:rgba(240,192,96,0.08);border:1px solid rgba(240,192,96,0.3);padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
        <span class="dot accent3"></span>
        <span style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.15em;color:var(--accent3);text-transform:uppercase;">Men's Bible Study active through April — depart 6:00 PM, home ~9:00 PM</span>
      </div>`;
    }
  }

  const fixedBlocks = fixBlockTimes(data.blocks);
  fixedBlocks.forEach((b, i) => {
    const pillHtml = b.pill ? `<span class="pill ${b.pill}">${b.pill}</span>` : '';
    const tips = b.tips ? b.tips.map(t => `<div class="tip-item">${t}</div>`).join('') : '';
    const expandSection = b.expand ? `
      <div class="block-expand">
        ${b.expand.map(e => `<div class="expand-section"><div class="expand-label">${e.label}</div><div class="expand-value ${e.highlight ? 'highlight' : ''}">${e.value}</div></div>`).join('')}
        ${tips ? `<div class="expand-tips">${tips}</div>` : ''}
      </div>` : '';

    html += `
      <div class="block" id="block-${i}" data-start="${b.time}" data-end="${b.end}" onclick="toggleBlock(this)">
        <div class="block-time">${formatDisplayTime(b.time)}<span class="end-time">${formatDisplayTime(b.end)}</span></div>
        <div class="block-content">
          <div class="block-title">${b.title} ${pillHtml}</div>
          <div class="block-detail">${b.detail}</div>
        </div>
        ${expandSection}
      </div>`;
  });

  col.innerHTML = html;
  highlightCurrentBlock();
}

function toggleBlock(el) {
  const wasExpanded = el.classList.contains('expanded');
  document.querySelectorAll('.block.expanded').forEach(b => b.classList.remove('expanded'));
  if (!wasExpanded) el.classList.add('expanded');
}

function formatDisplayTime(t) {
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
}

function toH24(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function fixBlockTimes(blocks) {
  let prevMins = 0;
  let pmOffset = 0;
  return blocks.map(b => {
    let startMins = toH24(b.time);
    let endMins = toH24(b.end);
    if (startMins + pmOffset < prevMins - 30) pmOffset += 12 * 60;
    const adjStart = startMins + pmOffset;
    const adjEnd = endMins < startMins ? endMins + pmOffset + 12 * 60 : endMins + pmOffset;
    prevMins = adjStart;
    const toStr = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
    return Object.assign({}, b, { time: toStr(adjStart), end: toStr(adjEnd) });
  });
}

// ─── CLOCK & PROGRESS ────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  document.getElementById('live-clock').textContent = `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;

  if (focusActive) {
    document.getElementById('focus-clock').textContent = `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
  }

  updateDayProgress();
  highlightCurrentBlock();
}

function updateDayProgress() {
  const now = new Date();
  const totalMinutes = 24 * 60;
  const elapsed = now.getHours() * 60 + now.getMinutes();
  const pct = Math.min(100, (elapsed / totalMinutes) * 100);
  document.getElementById('day-progress-fill').style.width = pct + '%';
}

function highlightCurrentBlock() {
  if (!currentDay) return;
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();

  document.querySelectorAll('.block').forEach(el => el.classList.remove('current-block'));

  const blocks = fixBlockTimes(schedules[currentDay].blocks);
  blocks.forEach((b, i) => {
    const [sh, sm] = b.time.split(':').map(Number);
    const [eh, em] = b.end.split(':').map(Number);
    const startMins = sh * 60 + sm;
    const endMins = eh * 60 + em;
    if (nowMins >= startMins && nowMins < endMins) {
      const el = document.getElementById(`block-${i}`);
      if (el) {
        el.classList.add('current-block');
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  });
}

// ─── FOCUS MODE ──────────────────────────────────────────────────────────────
function enterFocusMode() {
  if (!currentDay) return;
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const blocks = fixBlockTimes(schedules[currentDay].blocks);

  let blockName = 'FOCUS MODE';
  let blockTime = '';

  blocks.forEach(b => {
    const [sh, sm] = b.time.split(':').map(Number);
    const [eh, em] = b.end.split(':').map(Number);
    if (nowMins >= sh * 60 + sm && nowMins < eh * 60 + em) {
      blockName = b.title.toUpperCase();
      blockTime = `${formatDisplayTime(b.time)} – ${formatDisplayTime(b.end)}`;
    }
  });

  document.getElementById('focus-block-name').textContent = blockName;
  document.getElementById('focus-block-time').textContent = blockTime || 'Current Block';
  document.getElementById('focus-overlay').classList.add('active');
  document.getElementById('focus-btn').classList.add('active');
  focusActive = true;
  updateClock();
}

function exitFocusMode() {
  document.getElementById('focus-overlay').classList.remove('active');
  document.getElementById('focus-btn').classList.remove('active');
  focusActive = false;
}

// ─── NUDGES ──────────────────────────────────────────────────────────────────
function startNudges() {
  if (nudgeInterval) clearInterval(nudgeInterval);
  const minInterval = 12 * 60 * 1000; // 12 min
  const maxInterval = 28 * 60 * 1000; // 28 min

  function scheduleNext() {
    const delay = minInterval + Math.random() * (maxInterval - minInterval);
    nudgeInterval = setTimeout(() => {
      if (nudgesEnabled) showNudge();
      scheduleNext();
    }, delay);
  }
  scheduleNext();
}

function showNudge() {
  const msg = nudgeMessages[Math.floor(Math.random() * nudgeMessages.length)];
  document.getElementById('nudge-text').textContent = msg;
  const toast = document.getElementById('nudge-toast');
  toast.classList.add('show');

  // Play a soft audio tone
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(520, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}

  setTimeout(() => { if (!document.getElementById('nudge-toast').matches(':hover')) dismissNudge(); }, 12000);
}

function dismissNudge() {
  document.getElementById('nudge-toast').classList.remove('show');
}

function toggleNudges() {
  nudgesEnabled = !nudgesEnabled;
  const btn = document.getElementById('nudge-toggle');
  btn.textContent = nudgesEnabled ? 'Nudges: ON' : 'Nudges: OFF';
  btn.classList.toggle('active', nudgesEnabled);
}

// ─── STORAGE ─────────────────────────────────────────────────────────────────
const storageKey = () => `command_${currentDay}_${new Date().toDateString()}`;

function saveStorage() {
  if (!currentDay) return;
  const data = {
    p1: document.getElementById('p1')?.value,
    p2: document.getElementById('p2')?.value,
    p3: document.getElementById('p3')?.value,
    meal1: document.getElementById('meal1')?.value,
    meal2: document.getElementById('meal2')?.value,
    meal3: document.getElementById('meal3')?.value,
    meal4: document.getElementById('meal4')?.value,
    workout_type: document.getElementById('workout-type')?.value,
    workout_duration: document.getElementById('workout-duration')?.value,
    brain: document.getElementById('brain-dump')?.value,
  };
  try { localStorage.setItem(storageKey(), JSON.stringify(data)); } catch(e) {}
  const ind = document.getElementById('save-indicator');
  ind.textContent = 'saved ✓';
  ind.classList.add('saved');
  setTimeout(() => { ind.textContent = 'autosave'; ind.classList.remove('saved'); }, 2000);
}

function loadStorage() {
  if (!currentDay) return;
  try {
    const raw = localStorage.getItem(storageKey());
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.p1) document.getElementById('p1').value = data.p1;
    if (data.p2) document.getElementById('p2').value = data.p2;
    if (data.p3) document.getElementById('p3').value = data.p3;
    if (data.meal1) document.getElementById('meal1').value = data.meal1;
    if (data.meal2) document.getElementById('meal2').value = data.meal2;
    if (data.meal3) document.getElementById('meal3').value = data.meal3;
    if (data.meal4) document.getElementById('meal4').value = data.meal4;
    if (data.workout_type) document.getElementById('workout-type').value = data.workout_type;
    if (data.workout_duration) document.getElementById('workout-duration').value = data.workout_duration;
    if (data.brain) document.getElementById('brain-dump').value = data.brain;
  } catch(e) {}
}

// Autosave on any input
document.addEventListener('input', () => { if (currentDay) saveStorage(); });

// ─── INIT ────────────────────────────────────────────────────────────────────
setInterval(updateClock, 30000);
updateClock();
</script>

<script>
// ─── FIREBASE CONFIG ─────────────────────────────────────────────────────────
// Paste your Firebase project values here after completing setup
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCYm3pevF6vLWNH-8bEeEFmoZGsLc-vI0A",
  authDomain:        "command-schedule.firebaseapp.com",
  projectId:         "command-schedule",
  storageBucket:     "command-schedule.firebasestorage.app",
  messagingSenderId: "440397210250",
  appId:             "1:440397210250:web:9e879e71e7e72989af0373"
};

let db = null;
let firebaseReady = false;

function initFirebase() {
  try {
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    firebaseReady = true;
    showSyncStatus('connected');
  } catch(e) {
    firebaseReady = false;
    showSyncStatus('offline');
  }
}

function showSyncStatus(state) {
  const ind = document.getElementById('save-indicator');
  if (!ind) return;
  const states = {
    connected: ['sync on',       true,  2000],
    saving:    ['saving…',       false, 0],
    saved:     ['synced ✓',      true,  2000],
    offline:   ['local only',    false, 0],
    error:     ['sync error',    false, 0],
  };
  const [text, addSaved, timeout] = states[state] || ['autosave', false, 0];
  ind.textContent = text;
  addSaved ? ind.classList.add('saved') : ind.classList.remove('saved');
  if (timeout) setTimeout(() => { ind.textContent = 'autosave'; ind.classList.remove('saved'); }, timeout);
}

// ─── FIREBASE SAVE / LOAD ────────────────────────────────────────────────────
const firestoreDocId = () => {
  const d = new Date();
  const dateStr = d.toISOString().slice(0, 10);
  return `${dateStr}_${currentDay || 'unknown'}`;
};

function collectFields() {
  const g = id => document.getElementById(id)?.value || '';
  return {
    p1: g('p1'), p2: g('p2'), p3: g('p3'),
    meal1: g('meal1'), meal2: g('meal2'), meal3: g('meal3'), meal4: g('meal4'),
    workout_type: g('workout-type'), workout_duration: g('workout-duration'),
    brain: g('brain-dump'),
    updatedAt: new Date().toISOString(),
  };
}

function applyFields(data) {
  if (!data) return;
  const s = (id, val) => { const el = document.getElementById(id); if (el && val) el.value = val; };
  s('p1', data.p1); s('p2', data.p2); s('p3', data.p3);
  s('meal1', data.meal1); s('meal2', data.meal2);
  s('meal3', data.meal3); s('meal4', data.meal4);
  s('workout-type', data.workout_type);
  s('workout-duration', data.workout_duration);
  s('brain-dump', data.brain);
}

// Override the existing saveStorage with Firebase version
let cloudSaveTimer = null;
const _localStorageKey = () => `command_${currentDay}_${new Date().toDateString()}`;

function saveStorage() {
  if (!currentDay) return;
  const data = collectFields();
  // Always save locally as instant fallback
  try { localStorage.setItem(_localStorageKey(), JSON.stringify(data)); } catch(e) {}
  // Debounce cloud save — waits 1.5s after last keystroke before writing
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    if (firebaseReady && db) {
      showSyncStatus('saving');
      try {
        await db.collection('daily_entries').doc(firestoreDocId()).set(data, { merge: true });
        showSyncStatus('saved');
      } catch(e) { showSyncStatus('error'); }
    } else {
      const ind = document.getElementById('save-indicator');
      if (ind) { ind.textContent = 'saved locally ✓'; ind.classList.add('saved'); setTimeout(() => { ind.textContent = 'autosave'; ind.classList.remove('saved'); }, 2000); }
    }
  }, 1500);
}

// Override loadStorage with Firebase version
async function loadStorage() {
  if (!currentDay) return;
  // Try Firebase first
  if (firebaseReady && db) {
    try {
      const doc = await db.collection('daily_entries').doc(firestoreDocId()).get();
      if (doc.exists) { applyFields(doc.data()); return; }
    } catch(e) { /* fall through */ }
  }
  // Fallback to localStorage
  try {
    const raw = localStorage.getItem(_localStorageKey());
    if (raw) applyFields(JSON.parse(raw));
  } catch(e) {}
}

// Boot Firebase — config values must be filled in first
if (typeof firebase !== 'undefined' && FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY') {
  initFirebase();
} else {
  showSyncStatus('offline');
}
</script>
